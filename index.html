<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tank Battle 坦克大战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #1c2531 0%, #0b0f14 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #cfd8dc; user-select: none; overflow: hidden;
  }
  #wrap { position: relative; }
  canvas {
    display: block;
    border: 3px solid #2e3b47;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(0,0,0,.6), 0 0 120px rgba(50,120,200,.08);
    background: #12161c;
  }
  #hud {
    position: absolute; top: -38px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    font-size: 15px; letter-spacing: 1px;
  }
  #hud b { color: #ffd54f; font-weight: 600; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(8, 11, 15, .82); border-radius: 8px;
    text-align: center; gap: 14px;
  }
  .hidden { display: none; }
  h1 {
    font-size: 44px; letter-spacing: 6px; color: #eceff1;
    text-shadow: 0 0 18px rgba(120, 200, 255, .35);
  }
  .sub { font-size: 14px; color: #90a4ae; line-height: 1.9; }
  kbd {
    background: #26323f; border: 1px solid #3b4a58; border-radius: 4px;
    padding: 1px 7px; font-family: inherit; color: #b0bec5; font-size: 13px;
  }
  button {
    margin-top: 10px; padding: 12px 42px; font-size: 18px; letter-spacing: 3px;
    color: #0b0f14; background: #4fc3f7; border: none; border-radius: 6px;
    cursor: pointer; font-family: inherit; font-weight: 700;
    box-shadow: 0 0 20px rgba(79,195,247,.4);
    transition: transform .12s, box-shadow .12s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 4px 26px rgba(79,195,247,.6); }
  #finalScore { color: #ffd54f; font-size: 30px; font-weight: 700; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>得分 <b id="score">0</b></span>
    <span>第 <b id="wave">1</b> 波 · 剩余敌人 <b id="enemies">0</b></span>
    <span>生命 <b id="lives">3</b></span>
  </div>
  <canvas id="game" width="832" height="672"></canvas>

  <div class="overlay" id="startScreen">
    <h1>坦 克 大 战</h1>
    <div class="sub">
      <kbd>W A S D</kbd> / <kbd>方向键</kbd> 移动 &nbsp;·&nbsp; <kbd>空格</kbd> 射击 &nbsp;·&nbsp; <kbd>P</kbd> 暂停<br>
      消灭所有敌方坦克，守住每一波进攻。砖墙可以摧毁，钢墙无法击穿。
    </div>
    <button id="startBtn">开始游戏</button>
  </div>

  <div class="overlay hidden" id="gameOverScreen">
    <h1>游戏结束</h1>
    <div>最终得分</div>
    <div id="finalScore">0</div>
    <div class="sub" id="overStats"></div>
    <button id="retryBtn">再来一局</button>
  </div>

  <div class="overlay hidden" id="pauseScreen">
    <h1>已暂停</h1>
    <div class="sub">按 <kbd>P</kbd> 继续</div>
  </div>
</div>

<script>
"use strict";
// ============ 常量 ============
const TILE = 32;                 // 每格像素
const COLS = 26, ROWS = 21;      // 地图尺寸（832 x 672）
const W = COLS * TILE, H = ROWS * TILE;
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");

const EMPTY=0, BRICK=1, STEEL=2;  // 地形类型
const UP=0, RIGHT=1, DOWN=2, LEFT=3;
const DIRV = [[0,-1],[1,0],[0,1],[-1,0]];

// ============ 音效（WebAudio 生成，无外部资源）============
let audioCtx = null;
function beep(freq, dur, type="square", vol=0.08, slide=0) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), audioCtx.currentTime+dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  } catch(e){}
}

// ============ 地图 ============
// 每关一个字符串地图：. 空地  # 砖墙  @ 钢墙
const LEVELS = [
  [
    "..........................",
    "..####........####........",
    "..#..#..@@.....#..#.......",
    "..#..#..@@..####..#..@@...",
    "..........................",
    "....@@...####...@@........",
    "........#........#........",
    "..####..#..####..#..####..",
    "..#.....................#.",
    "..#..@@..####...##......#.",
    "...............##........",
    "..####..#...........####..",
    "........#..@@.............",
    "..@@...##....##....@@.....",
    "..........................",
    "..####.....##.....####....",
    "..#........##........#....",
    "..#...####.....####..#....",
    "..........................",
    "..............P...........",
    "..........................",
  ],
  [
    "..........................",
    "....@@..........@@........",
    "....##..####..##..........",
    "........#..#..............",
    "..####..#..#..####........",
    "..#..............#..@@...",
    "..#..@@..####....#........",
    ".........#.......#..####..",
    "....##...#..##............",
    "....#........#..@@........",
    "....#..####..#............",
    "..........#.....####......",
    "..@@......#.....#.........",
    "......##..#..##..#..##....",
    "......#..........#........",
    "..####.#..####..#.####....",
    "..................#.......",
    "..@@...#..........#..@@...",
    ".......#...####...#.......",
    "..............P...........",
    "..........................",
  ],
];

let map = [];          // map[row][col] = EMPTY/BRICK/STEEL
let player, enemies, bullets, particles, wallsToDraw;
let score = 0, lives = 3, wave = 1, state = "menu";
let spawnQueue = [], spawnTimer = 0, waveTotal = 0;
let shake = 0;
const keys = {};

function loadMap(idx) {
  const rows = LEVELS[idx % LEVELS.length];
  map = rows.map(r => r.split("").map(c => c === "#" ? BRICK : c === "@" ? STEEL : EMPTY));
}

function tileAt(px, py) {
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return STEEL;
  return map[r][c];
}
function setTile(px, py, v) {
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  if (c >= 0 && c < COLS && r >= 0 && r < ROWS) map[r][c] = v;
}

// 矩形（坦克体积）与地形碰撞：检查四角+边中点
function hitsWall(x, y, size) {
  const s = size - 1;
  return tileAt(x, y) !== EMPTY || tileAt(x + s, y) !== EMPTY ||
         tileAt(x, y + s) !== EMPTY || tileAt(x + s, y + s) !== EMPTY ||
         tileAt(x + s/2, y) !== EMPTY || tileAt(x + s/2, y + s) !== EMPTY ||
         tileAt(x, y + s/2) !== EMPTY || tileAt(x + s, y + s/2) !== EMPTY;
}

// ============ 实体 ============
function makeTank(x, y, dir, color, isPlayer) {
  return { x, y, dir, color, isPlayer,
    size: 26, speed: isPlayer ? 2.2 : 1.3,
    cooldown: 0, alive: true, aiTimer: 0, moving: true, hp: isPlayer ? 1 : 1 };
}

function spawnEnemy() {
  // 在顶部三个出生点中随机选一个无阻挡的点
  const spots = [TILE*1.5, TILE*12, TILE*23.5];
  const sx = spots[Math.floor(Math.random()*3)];
  const sy = TILE * 0.5;
  const t = makeTank(sx, sy, DOWN, "#e57373", false);
  // 波次越高敌人越强
  t.hp = wave >= 3 && Math.random() < 0.3 ? 2 : 1;
  t.speed = 1.3 + Math.min(1.2, wave * 0.12) * Math.random();
  enemies.push(t);
}

function shoot(tank) {
  if (tank.cooldown > 0) return;
  const dv = DIRV[tank.dir];
  const bx = tank.x + tank.size/2 + dv[0]*16, by = tank.y + tank.size/2 + dv[1]*16;
  bullets.push({ x: bx, y: by, dir: tank.dir, speed: tank.isPlayer ? 6.5 : 4.5,
    owner: tank.isPlayer ? "p" : "e", alive: true });
  tank.cooldown = tank.isPlayer ? 18 : 50 + Math.random()*40;
  beep(tank.isPlayer ? 680 : 320, 0.08, "square", 0.05, tank.isPlayer ? -300 : -150);
}

function explode(x, y, big) {
  const n = big ? 26 : 14;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * (big ? 4.5 : 3);
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 20 + Math.random()*20, maxLife: 40,
      color: Math.random() < 0.5 ? "#ffb74d" : (Math.random() < 0.5 ? "#ff7043" : "#ffe082") });
  }
  if (big) shake = 10;
  beep(big ? 90 : 140, big ? 0.35 : 0.18, "sawtooth", 0.1, -60);
}

// ============ 碰撞辅助 ============
function rectHit(a, b, pad=0) {
  return a.x - pad < b.x + b.size && a.x + a.size + pad > b.x &&
         a.y - pad < b.y + b.size && a.y + a.size + pad > b.y;
}

// 坦克移动（先按方向对齐到网格的一半，转向时更容易钻缝）
function moveTank(t, dx, dy) {
  const nx = t.x + dx, ny = t.y + dy;
  if (!hitsWall(nx, ny, t.size)) {
    // 不撞其他坦克
    const box = { x: nx, y: ny, size: t.size };
    for (const o of enemies) if (o !== t && o.alive && rectHit(box, o, -2)) return false;
    if (!t.isPlayer && player.alive && rectHit(box, player, -2)) return false;
    if (t.isPlayer) for (const o of enemies) if (o.alive && rectHit(box, o, -2)) return false;
    t.x = nx; t.y = ny;
    return true;
  }
  return false;
}

function tryMove(t, dir) {
  t.dir = dir;
  const [dx, dy] = DIRV[dir].map(v => v * t.speed);
  const ok = moveTank(t, dx, dy);
  if (!ok) {
    // 尝试吸附网格，让贴墙转向更顺滑
    const snap = 4;
    if (dir === UP || dir === DOWN) {
      const gx = Math.round((t.x + t.size/2) / TILE) * TILE - t.size/2;
      if (Math.abs(gx - t.x) <= snap && !hitsWall(gx, t.y + dy, t.size)) t.x = gx;
    } else {
      const gy = Math.round((t.y + t.size/2) / TILE) * TILE - t.size/2;
      if (Math.abs(gy - t.y) <= snap && !hitsWall(t.x + dx, gy, t.size)) t.y = gy;
    }
  }
  return ok;
}

// ============ AI ============
function enemyAI(t) {
  t.aiTimer--;
  const dist = player.alive ? Math.abs(player.x - t.x) + Math.abs(player.y - t.y) : 9999;

  // 与玩家同行/同列且大致对准时，停下来射击
  const alignedX = player.alive && Math.abs(player.x - t.x) < 20;
  const alignedY = player.alive && Math.abs(player.y - t.y) < 20;
  if (alignedX && player.y < t.y && Math.random() < 0.05) { shoot(t); return; }
  if (alignedX && player.y > t.y && Math.random() < 0.05) { shoot(t); t.dir = DOWN; return; }
  if (alignedY && player.x < t.x && Math.random() < 0.05) { shoot(t); t.dir = LEFT; return; }
  if (alignedY && player.x > t.x && Math.random() < 0.05) { shoot(t); t.dir = RIGHT; return; }

  // 周期性重新决策：偏向朝玩家方向走
  if (t.aiTimer <= 0) {
    t.aiTimer = 40 + Math.random()*60;
    const r = Math.random();
    if (player.alive && r < 0.55) {
      const opts = [];
      if (Math.abs(player.y - t.y) > Math.abs(player.x - t.x)) {
        opts.push(player.y < t.y ? UP : DOWN);
        if (Math.abs(player.x - t.x) > TILE) opts.push(player.x < t.x ? LEFT : RIGHT);
      } else {
        opts.push(player.x < t.x ? LEFT : RIGHT);
        if (Math.abs(player.y - t.y) > TILE) opts.push(player.y < t.y ? UP : DOWN);
      }
      t.wantDir = opts[Math.floor(Math.random()*opts.length)];
    } else {
      t.wantDir = Math.floor(Math.random()*4);
    }
  }

  if (!tryMove(t, t.wantDir ?? t.dir)) {
    // 撞墙则换个随机方向，偶尔朝墙开炮（拆路）
    if (Math.random() < 0.35) shoot(t);
    t.wantDir = Math.floor(Math.random()*4);
    t.aiTimer = 20 + Math.random()*30;
  }
  if (Math.random() < 0.008) shoot(t);
}

// ============ 更新逻辑 ============
function startWave() {
  loadMap(wave - 1);
  enemies = []; bullets = []; particles = [];
  spawnQueue = 4 + wave * 2; waveTotal = spawnQueue;
  spawnTimer = 30;
  if (!player) player = makeTank(TILE*12.5, H - TILE*1.5, UP, "#66bb6a", true);
  player.alive = true; player.x = TILE*12.5; player.y = H - TILE*1.5;
  player.dir = UP; player.cooldown = 0;
  updateHUD();
}

function killPlayer() {
  if (!player.alive) return;
  player.alive = false;
  explode(player.x + player.size/2, player.y + player.size/2, true);
  lives--;
  updateHUD();
  if (lives <= 0) {
    state = "over";
    document.getElementById("finalScore").textContent = score;
    document.getElementById("overStats").textContent = `坚持到了第 ${wave} 波`;
    document.getElementById("gameOverScreen").classList.remove("hidden");
  } else {
    setTimeout(() => {
      if (state !== "playing") return;
      player.alive = true; player.x = TILE*12.5; player.y = H - TILE*1.5; player.dir = UP;
    }, 1200);
  }
}

function update() {
  if (state !== "playing") return;

  // 玩家输入
  if (player.alive) {
    let moved = false;
    if (keys["ArrowUp"] || keys["KeyW"])    { tryMove(player, UP); moved = true; }
    else if (keys["ArrowDown"] || keys["KeyS"])  { tryMove(player, DOWN); moved = true; }
    else if (keys["ArrowLeft"] || keys["KeyA"])  { tryMove(player, LEFT); moved = true; }
    else if (keys["ArrowRight"] || keys["KeyD"]) { tryMove(player, RIGHT); moved = true; }
    if (keys["Space"]) shoot(player);
    player.cooldown--;
  }

  // 敌人出生
  if (spawnQueue > 0) {
    spawnTimer--;
    if (spawnTimer <= 0 && enemies.length < 5) { spawnEnemy(); spawnQueue--; spawnTimer = 90; }
  }

  // 敌人 AI
  for (const e of enemies) if (e.alive) { e.cooldown--; enemyAI(e); }

  // 子弹
  for (const b of bullets) {
    if (!b.alive) continue;
    b.x += DIRV[b.dir][0] * b.speed;
    b.y += DIRV[b.dir][1] * b.speed;

    // 出界
    if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) { b.alive = false; explode(b.x, b.y, false); continue; }

    // 打墙
    if (tileAt(b.x, b.y) !== EMPTY) {
      b.alive = false;
      if (tileAt(b.x, b.y) === BRICK) {
        setTile(b.x, b.y, EMPTY);
        explode(b.x, b.y, false);
      } else {
        explode(b.x, b.y, false);
        beep(200, 0.06, "square", 0.05);
      }
      continue;
    }

    // 打坦克
    const bBox = { x: b.x - 3, y: b.y - 3, size: 6 };
    if (b.owner === "p") {
      for (const e of enemies) {
        if (e.alive && rectHit(bBox, e, 2)) {
          b.alive = false; e.hp--;
          if (e.hp <= 0) {
            e.alive = false;
            explode(e.x + e.size/2, e.y + e.size/2, true);
            score += 100; updateHUD();
          } else {
            explode(b.x, b.y, false);
            beep(250, 0.08, "square", 0.06);
          }
          break;
        }
      }
    } else if (player.alive && rectHit(bBox, player, 1)) {
      b.alive = false;
      killPlayer();
    }

    // 子弹互相抵消
    if (b.alive) for (const o of bullets) {
      if (o.alive && o.owner !== b.owner && Math.hypot(o.x-b.x, o.y-b.y) < 8) {
        o.alive = false; b.alive = false; explode(b.x, b.y, false);
      }
    }
  }

  // 粒子
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life--; }
  particles = particles.filter(p => p.life > 0);
  bullets = bullets.filter(b => b.alive);
  enemies = enemies.filter(e => e.alive);
  if (shake > 0) shake--;

  // 胜利条件
  if (spawnQueue === 0 && enemies.length === 0) {
    wave++;
    score += 200;
    startWave();
  }
}

// ============ 绘制 ============
function drawTank(t) {
  const s = t.size;
  ctx.save();
  ctx.translate(t.x + s/2, t.y + s/2);
  ctx.rotate(t.dir * Math.PI/2);
  // 履带
  ctx.fillStyle = t.isPlayer ? "#2e5d31" : "#7a3030";
  ctx.fillRect(-s/2, -s/2, s, 5);
  ctx.fillRect(-s/2, s/2 - 5, s, 5);
  ctx.fillStyle = "rgba(0,0,0,.25)";
  for (let i = -s/2 + 2; i < s/2; i += 6) { ctx.fillRect(i, -s/2, 2, 5); ctx.fillRect(i, s/2-5, 2, 5); }
  // 车体
  ctx.fillStyle = t.color;
  roundRect(-s/2+4, -s/2+4, s-8, s-8, 4); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.18)";
  roundRect(-s/2+4, -s/2+4, s-8, (s-8)/2, 4); ctx.fill();
  // 炮塔
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.beginPath(); ctx.arc(0, 0, s/4.4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = t.color;
  ctx.beginPath(); ctx.arc(0, 0, s/5.2, 0, Math.PI*2); ctx.fill();
  // 炮管
  ctx.fillStyle = t.isPlayer ? "#a5d6a7" : "#ef9a9a";
  ctx.fillRect(-2.5, -s/2 - 6, 5, s/2 + 8);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  // 背景
  ctx.fillStyle = "#12161c";
  ctx.fillRect(-20, -20, W+40, H+40);
  ctx.fillStyle = "rgba(255,255,255,.02)";
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    if ((r+c) % 2 === 0) ctx.fillRect(c*TILE, r*TILE, TILE, TILE);

  // 地形
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = map[r][c];
    if (t === BRICK) {
      ctx.fillStyle = "#8d5524";
      ctx.fillRect(c*TILE, r*TILE, TILE, TILE);
      ctx.fillStyle = "rgba(0,0,0,.3)";
      ctx.fillRect(c*TILE, r*TILE+14, TILE, 3);
      ctx.fillRect(c*TILE, r*TILE, TILE, 1);
      ctx.fillStyle = "rgba(255,255,255,.12)";
      for (let i = 0; i < TILE; i += 16) ctx.fillRect(c*TILE+i+7, r*TILE, 2, 14);
    } else if (t === STEEL) {
      ctx.fillStyle = "#78909c";
      ctx.fillRect(c*TILE+1, r*TILE+1, TILE-2, TILE-2);
      ctx.fillStyle = "#b0bec5";
      ctx.fillRect(c*TILE+3, r*TILE+3, TILE-6, 4);
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.fillRect(c*TILE+3, r*TILE+TILE-8, TILE-6, 5);
    }
  }

  // 子弹
  for (const b of bullets) {
    ctx.fillStyle = b.owner === "p" ? "#fff59d" : "#ffab91";
    ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,200,.25)";
    ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI*2); ctx.fill();
  }

  // 坦克
  if (player.alive) drawTank(player);
  for (const e of enemies) drawTank(e);

  // 粒子
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function updateHUD() {
  document.getElementById("score").textContent = score;
  document.getElementById("wave").textContent = wave;
  document.getElementById("enemies").textContent = enemies.length + spawnQueue;
  document.getElementById("lives").textContent = Math.max(0, lives);
}

// ============ 主循环 ============
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ============ 输入 ============
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if (e.code === "KeyP" && (state === "playing" || state === "paused")) {
    state = state === "playing" ? "paused" : "playing";
    document.getElementById("pauseScreen").classList.toggle("hidden", state === "playing");
  }
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

function beginGame() {
  score = 0; lives = 3; wave = 1;
  player = null;
  state = "playing";
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("gameOverScreen").classList.add("hidden");
  document.getElementById("pauseScreen").classList.add("hidden");
  startWave();
}
document.getElementById("startBtn").addEventListener("click", beginGame);
document.getElementById("retryBtn").addEventListener("click", beginGame);
</script>
</body>
</html>
